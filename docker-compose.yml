
services:
  core:
    container_name: core
    build:
      context: ./core
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    volumes:
      - ./core:/var/www
    depends_on:
      - pgvector
      - rabbitmq
    networks:
      - project

  nginx:
    container_name: nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./core:/var/www
      - ./core/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - core
    networks:
      - project

  worker:
    container_name: worker
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./worker:/app
    depends_on:
      - pgvector
      - rabbitmq
    networks:
      - project

  pgvector:
    container_name: pgvector
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - project

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - project

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  project:
    driver: bridge
